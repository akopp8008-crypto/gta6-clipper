[project]
name = "gta6-clipper"
version = "0.1.0"
description = "Finds, cuts, captions and posts the best GTA 6 gameplay moments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]
